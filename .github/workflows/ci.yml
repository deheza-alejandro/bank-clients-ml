# See documentation in docs/development/ci.md
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  MPLBACKEND: Agg
  UV_NO_PROGRESS: "1"

jobs:
  python-quality:
    name: Python quality
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.1" # Keep aligned with ARG UV_VERSION in the Dockerfile.
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          prune-cache: true
      - name: Check lockfile
        run: uv lock --check
      - name: Synchronize dependencies
        run: uv sync --locked
      - name: Check formatting
        run: uv run --no-sync ruff format --check .
      - name: Lint Python
        run: uv run --no-sync ruff check .
      - name: Check types
        run: uv run --no-sync pyrefly check
      - name: Check tool versions
        run: uv run --no-sync python scripts/check_python_versions.py
      - name: Validate Lefthook configuration
        run: uv run --no-sync lefthook validate

  markdown:
    name: Markdown
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.1" # Keep aligned with ARG UV_VERSION in the Dockerfile.
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          prune-cache: true
      - name: Synchronize dependencies
        run: uv sync --locked
      - name: Lint Markdown
        run: uv run --no-sync rumdl check .
      - name: Check Markdown formatting
        run: uv run --no-sync rumdl fmt --check --silent .

  spelling:
    name: Spelling
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.0" # Keep aligned with ARG BUN_VERSION in the Dockerfile.
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check spelling
        run: bun cspell --no-must-find-files "**"

  tests:
    name: Tests
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.1" # Keep aligned with ARG UV_VERSION in the Dockerfile.
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          prune-cache: true
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.0" # Keep aligned with ARG BUN_VERSION in the Dockerfile.
      - name: Synchronize Python dependencies
        run: uv sync --locked
      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile
      - name: Run tests with coverage
        run: >-
          uv run --no-sync pytest
          --cov=bank_clients_ml
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=80
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 7

  docker:
    name: Docker
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build development image
        env:
          CACHE_TO: ${{ github.ref == 'refs/heads/main' && 'type=gha,mode=max' || '' }}
        run: |
          args=(
            --target dev
            --tag bank-clients-ml:dev
            --build-arg "UID=$(id -u)"
            --build-arg "GID=$(id -g)"
            --cache-from type=gha
            --load
          )
          if [ -n "$CACHE_TO" ]; then
            args+=(--cache-to "$CACHE_TO")
          fi
          docker buildx build "${args[@]}" .
      - name: Start Compose service
        run: docker compose up --detach --no-build --wait --wait-timeout 100
      - name: Verify package import
        run: docker compose exec -T dev python -c "import bank_clients_ml"
      - name: Show container logs on failure
        if: failure()
        continue-on-error: true
        run: docker compose logs --no-color
      - name: Stop Compose service
        if: always()
        run: docker compose down --volumes --remove-orphans

  ci-success:
    name: CI success
    if: always()
    needs:
      - python-quality
      - markdown
      - spelling
      - tests
      - docker
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Fail when a required job fails
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
      - name: Report success
        run: echo "All required jobs passed."
