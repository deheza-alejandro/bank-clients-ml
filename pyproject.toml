[project]
name = "bank-clients-ml"
version = "0.1.0"
description = "Machine learning project"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.1",
    "numpy>=2.5.1",
    "polars>=1.43.2",
    "pyarrow>=25.0.0",
    "pydantic-settings>=2.15.0",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.0",
]

[project.scripts]
bank-clients-ml = "bank_clients_ml:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "commitizen>=4.18.0",
    "lefthook>=2.1.12",
    "marimo>=0.24.0",
    "pyrefly>=1.2.0",
    "ruff>=0.16.1",
    "rumdl>=0.2.73",
]

[tool.pyrefly]
project-includes = [
    "**/*.py*"
]

[tool.ruff]
extend-exclude = [".env", ".venv"]

[tool.ruff.lint]
extend-select = [
    "C901",    # mccabe: cyclomatic complexity
    "PLR0911", # pylint: too-many-return-statements
    "PLR0913", # pylint: too-many-arguments
    "PLR0915", # pylint: too-many-statements
    "E", "W",  # pycodestyle
    "F",       # Pyflakes
    "I",       # isort
    "UP",      # pyupgrade
    "B",       # flake8-bugbear
    "SIM",     # flake8-simplify
    "PTH",     # flake8-use-pathlib
    "S",       # flake8-bandit
    "RUF",     # Ruff-specific rules
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-statements = 30
max-args = 7
max-returns = 5

[tool.ruff.lint.pycodestyle]
max-line-length = 100

[tool.ruff.lint.extend-per-file-ignores]
"notebooks/*.py" = [ # for marimo files
    "PLR0913",
    "PLR1711",
    "B018",     # Found useless expression. Either assign it to a variable or remove it
    "F841",     # Local variable name is assigned to but never used
    "E501"      # Line too long
]
# "tests/*" = ["S101", "C901", "PLR0911", "PLR0915"]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "$version"
version_scheme = "pep440"
version_provider = "uv"
update_changelog_on_bump = true
major_version_zero = true


[tool.rumdl]
# Global configuration options
# line-length = 100
# disable = [] # List of rules to disable
# extend-enable = ["MD060"]  # Add opt-in rules (additive, keeps defaults)
# extend-disable = []  # Additional rules to disable (additive)

# List of file/directory patterns to include for linting (if provided, only these will be linted)
# include = [
#    "docs/*.md",
#    "src/**/*.md",
#    "README.md"
# ]

exclude = [
    # Common directories to exclude
    ".git",
    ".github",
    "node_modules",
    "vendor",
    "dist",
    "build",

    # Specific files or patterns
    "CHANGELOG.md",
    "LICENSE.md",
]
respect-gitignore = true

# Rule-specific configurations (uncomment and modify as needed)

# [tool.rumdl.MD003]
# style = "atx"  # Heading style (atx, atx_closed, setext)

# [tool.rumdl.MD004]
# style = "asterisk"  # Unordered list style (asterisk, plus, dash, consistent)

# [tool.rumdl.MD007]
# indent = 4  # Unordered list indentation

# [tool.rumdl.MD013]
# line-length = 100  # Line length
# code-blocks = false  # Exclude code blocks from line length check
# tables = false  # Exclude tables from line length check
# headings = true  # Include headings in line length check

# [tool.rumdl.MD044]
# names = ["rumdl", "Markdown", "GitHub"]  # Proper names that should be capitalized correctly
# code-blocks = false  # Check code blocks for proper names (default: false, skips code blocks)

[tool.rumdl.code-block-tools]
enabled = true

[tool.rumdl.code-block-tools.tools.ruff-lint-custom]
command = ["uv", "run", "--no-sync", "--no-progress", "ruff", "check", "--output-format=concise", "-"]
stdin = true
stdout = true

[tool.rumdl.code-block-tools.tools.ruff-format-custom]
command = ["uv", "run", "--no-sync", "--no-progress", "ruff", "format", "-"]
stdin = true
stdout = true

[tool.rumdl.code-block-tools.languages]
python = { lint = ["ruff-lint-custom"], format = ["ruff-format-custom"] }
