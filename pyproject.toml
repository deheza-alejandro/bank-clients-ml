[project]
name = "bank-clients-ml"
version = "0.1.0"
description = "Machine learning project"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fpdf2>=2.8.7",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.1",
    "numpy>=2.5.1",
    "pandas>=3.0.5",
    "pyarrow>=25.0.0",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.0",
]

[project.scripts]
bank-clients-ml = "bank_clients_ml:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "ipython>=9.16.1",
    "jupytext>=1.19.5",
    "pyrefly>=1.2.0",
    "ruff>=0.16.1",
]

[tool.jupytext]
formats = "ipynb,md"

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]

[tool.ruff.lint]
extend-select = [
    "C901",    # mccabe: cyclomatic complexity
    "PLR0911", # pylint: too-many-return-statements
    "PLR0913", # pylint: too-many-arguments
    "PLR0915", # pylint: too-many-statements
    "E", "W",  # pycodestyle
    "F",       # Pyflakes
    "I",       # isort
    "UP",      # pyupgrade
    "B",       # flake8-bugbear
    "SIM",     # flake8-simplify
    "PTH",     # flake8-use-pathlib
    "S",       # flake8-bandit
    "RUF",     # Ruff-specific rules
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-statements = 30
max-args = 5
max-returns = 5

[tool.ruff.lint.pycodestyle]
max-line-length = 100

# [tool.ruff.lint.extend-per-file-ignores]
# "tests/*" = ["S101", "C901", "PLR0911", "PLR0915"]
