no_tty: true

pre-commit:
  parallel: true
  jobs:
    - name: uv-lock-check
      glob: "{pyproject.toml,uv.lock}"
      run: uv lock --check --no-progress
    - name: python-format-lint-check
      glob: "*.py"
      group:
        piped: true
        jobs:
          - run: uv run --no-sync --no-progress ruff format --check {staged_files}
          - run: uv run --no-sync --no-progress ruff check {staged_files}
    - name: markdown-format-lint-check
      glob: "*.md"
      group:
        piped: true
        jobs:
          - run: uv run --no-sync --no-progress rumdl check {staged_files}
            fail_text: "Run `uv run lefthook run auto-fix-staged-markdown` to fix all issues in the staged files that can be automatically resolved"
          - run: uv run --no-sync --no-progress rumdl fmt --check --silent {staged_files}
            fail_text: "Run `uv run lefthook run auto-fix-staged-markdown` to fix all issues in the staged files that can be automatically resolved"

commit-msg:
  piped: true
  commands:
    01-format-commit-body:
      priority: 1
      run: uv run .lefthook/commit-msg/format-commit-body.py {1}
    02-commitizen-check:
      priority: 2
      run: uv run cz check --allow-abort --commit-msg-file {1} --message-length-limit 50

pre-push:
  piped: true
  commands:
    pyrefly-locked-check:
      priority: 1
      glob: "*.py"
      run: uv run --locked pyrefly check
    cspell:
      priority: 2
      run: bun cspell --no-must-find-files {staged_files}

post-checkout:
  commands:
    uv-sync-locked:
      files: git diff --name-only HEAD@{1} HEAD
      glob: "{pyproject.toml,uv.lock}"
      run: uv sync --locked

post-merge:
  commands:
    uv-sync-locked:
      files: git diff --name-only ORIG_HEAD HEAD
      glob: "{pyproject.toml,uv.lock}"
      run: uv sync --locked

post-rewrite:
  commands:
    uv-sync-locked:
      files: git diff-tree -r --name-only HEAD@{1} HEAD
      glob: "{pyproject.toml,uv.lock}"
      run: uv sync --locked

auto-fix-staged-markdown:
  piped: true
  commands:
    01-fmt:
      priority: 1
      glob: "*.md"
      run: uv run rumdl fmt {staged_files}
    02-lint-fix:
      priority: 2
      glob: "*.md"
      run: uv run rumdl check --fix {staged_files}
