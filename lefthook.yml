# See documentation in docs/development/hooks.md
no_tty: true

pre-commit:
  parallel: true
  jobs:
    - name: uv-lock-check
      glob: "{pyproject.toml,uv.lock}"
      run: uv lock --check --no-progress
      fail_text: "Run `uv sync` and stage the updated `uv.lock`."
    - name: bun-lock-check
      glob: "{package.json,bun.lock}"
      run: bun install --frozen-lockfile --dry-run --no-progress
      fail_text: "Run `bun install` and add the updated `bun.lock` to the commit."
    - name: python-format-lint-test-check
      glob: "*.py"
      group:
        piped: true
        jobs:
          - run: uv run --no-sync --no-progress ruff format --check {staged_files}
            fail_text: "Run `uv run --no-sync ruff format` and stage the formatted files."
          - run: uv run --no-sync --no-progress ruff check {staged_files}
            fail_text: "Run `uv run --no-sync ruff check --fix` and fix the remaining issues manually."
          - run: uv run --no-sync --no-progress pytest -m 'not slow' --cov=bank_clients_ml --cov-fail-under=80
            fail_text: "Fix the failing tests or the coverage gap before committing."
    - name: markdown-format-lint-check
      glob: "*.md"
      group:
        piped: true
        jobs:
          - run: uv run --no-sync --no-progress rumdl check {staged_files}
            fail_text: "Run `uv run --no-sync lefthook run auto-fix-staged-markdown` to fix all issues in the staged files that can be automatically resolved."
          - run: uv run --no-sync --no-progress rumdl fmt --check --silent {staged_files}
            fail_text: "Run `uv run --no-sync lefthook run auto-fix-staged-markdown` to fix all issues in the staged files that can be automatically resolved."
    - name: docker-compose-config-check
      glob: "compose.y*ml"
      run: docker compose config --quiet
      fail_text: "Fix `compose.yaml` and validate it with `docker compose config --quiet`."
    - name: validate-lefthook
      glob: "{.,}lefthook*.{yml,yaml}"
      run: uv run --no-sync --no-progress lefthook validate
      fail_text: "Fix the Lefthook configuration and run `uv run --no-sync lefthook validate`."

commit-msg:
  piped: true
  commands:
    01-format-commit-body:
      priority: 1
      run: uv run --no-sync --no-progress scripts/commit_msg/format_commit_body.py {1}
    02-commitizen-check:
      priority: 2
      run: uv run --no-sync --no-progress cz check --allow-abort --commit-msg-file {1} --message-length-limit 50
      fail_text: "Write a Conventional Commits message with a header of 50 characters or fewer."

pre-push:
  piped: true
  commands:
    uv-sync-locked:
      priority: 1
      run: uv sync --locked --no-progress
      fail_text: "The environment could not be synchronized with `uv sync --locked`. See `docs/troubleshooting.md#sincronización-fallida-del-entorno`."
    bun-install-frozen-lockfile:
      priority: 2
      run: bun install --frozen-lockfile --no-progress
      fail_text: "The environment could not be synchronized with `bun install --frozen-lockfile`. See `docs/troubleshooting.md#sincronización-fallida-del-entorno`."
    pyrefly:
      priority: 3
      glob: "*.py"
      run: uv run --no-sync --no-progress pyrefly check
      fail_text: "Fix the type errors reported by Pyrefly before pushing."
    python-versions:
      priority: 4
      glob: "{Dockerfile,.python-version,pyproject.toml,scripts/check_python_versions.py}"
      run: uv run --no-sync --no-progress scripts/check_python_versions.py
      fail_text: "Align the versions in `Dockerfile`, `.python-version` and `pyproject.toml`; see `docs/development/hooks.md`."
    cspell:
      priority: 5
      run: bun --no-install --no-progress cspell --no-must-find-files {all_files}
      fail_text: "Fix the misspellings or add legitimate words to `cspell.json`."
    test:
      priority: 6
      glob: "*.py"
      run: uv run --no-sync --no-progress pytest --cov=bank_clients_ml --cov-fail-under=80
      fail_text: "Fix the failing tests or the coverage gap before pushing."
    

post-checkout:
  commands:
    uv-sync-locked:
      files: git diff --name-only HEAD@{1} HEAD
      glob: "{pyproject.toml,uv.lock}"
      run: uv sync --locked --no-progress
      fail_text: "The environment could not be synchronized with `uv sync --locked`. See `docs/troubleshooting.md#sincronización-fallida-del-entorno`."
    bun-sync-frozen:
      files: git diff --name-only HEAD@{1} HEAD
      glob: "{package.json,bun.lock}"
      run: bun install --frozen-lockfile --no-progress
      fail_text: "The environment could not be synchronized with `bun install --frozen-lockfile`. See `docs/troubleshooting.md#sincronización-fallida-del-entorno`."

post-merge:
  commands:
    uv-sync-locked:
      files: git diff --name-only ORIG_HEAD HEAD
      glob: "{pyproject.toml,uv.lock}"
      run: uv sync --locked --no-progress
      fail_text: "The environment could not be synchronized with `uv sync --locked`. See `docs/troubleshooting.md#sincronización-fallida-del-entorno`."
    bun-sync-frozen:
      files: git diff --name-only ORIG_HEAD HEAD
      glob: "{package.json,bun.lock}"
      run: bun install --frozen-lockfile --no-progress
      fail_text: "The environment could not be synchronized with `bun install --frozen-lockfile`. See `docs/troubleshooting.md#sincronización-fallida-del-entorno`."

post-rewrite:
  commands:
    uv-sync-locked:
      files: git diff-tree -r --name-only HEAD@{1} HEAD
      glob: "{pyproject.toml,uv.lock}"
      run: uv sync --locked --no-progress
      fail_text: "The environment could not be synchronized with `uv sync --locked`. See `docs/troubleshooting.md#sincronización-fallida-del-entorno`."
    bun-sync-frozen:
      files: git diff-tree -r --name-only HEAD@{1} HEAD
      glob: "{package.json,bun.lock}"
      run: bun install --frozen-lockfile --no-progress
      fail_text: "The environment could not be synchronized with `bun install --frozen-lockfile`. See `docs/troubleshooting.md#sincronización-fallida-del-entorno`."

auto-fix-staged-markdown:
  piped: true
  commands:
    01-fmt:
      priority: 1
      glob: "*.md"
      run: uv run rumdl fmt {staged_files}
    02-lint-fix:
      priority: 2
      glob: "*.md"
      run: uv run rumdl check --fix {staged_files}
