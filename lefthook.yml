pre-commit:
  parallel: true
  commands:
    uv-lock-check:
      glob: "{pyproject.toml,uv.lock}"
      run: uv lock --check
    format-locked-check:
      glob: "*.py"
      run: uv run --locked ruff format --check {staged_files}
    lint-locked-check:
      glob: "*.py"
      run: uv run --locked ruff check {staged_files}

commit-msg:
  piped: true
  commands:
    01-format-commit-body:
      priority: 1
      run: uv run .lefthook/commit-msg/format-commit-body.py {1}
    02-commitizen-check:
      priority: 2
      run: uv run cz check --allow-abort --commit-msg-file {1} --message-length-limit 50

post-checkout:
  commands:
    uv-sync-locked:
      files: git diff --name-only HEAD@{1} HEAD
      glob: "{pyproject.toml,uv.lock}"
      run: uv sync --locked

post-merge:
  commands:
    uv-sync-locked:
      files: git diff --name-only ORIG_HEAD HEAD
      glob: "{pyproject.toml,uv.lock}"
      run: uv sync --locked

post-rewrite:
  commands:
    uv-sync-locked:
      files: git diff-tree -r --name-only HEAD@{1} HEAD
      glob: "{pyproject.toml,uv.lock}"
      run: uv sync --locked
