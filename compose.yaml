name: bank-clients-ml

services:
  dev:
    build:
      context: .
      target: dev
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    image: bank-clients-ml:dev
    init: true
    ports:
      - "127.0.0.1:${MARIMO_HOST_PORT:-2718}:2718"
    volumes:
      - .:/app
      # Named volume for Node: module resolution requires node_modules inside
      # the project, and the bind mount would expose the host's binaries.
      # Python has no such constraint.
      - node_modules:/app/node_modules
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:2718/health", timeout=2)
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 30s
    stdin_open: true
    tty: true

volumes:
  node_modules:
